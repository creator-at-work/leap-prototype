<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3e6d8;font-family:'DM Sans';color:#3b2a22}
.head{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;border-bottom:1.5px solid #e2cdb8}
.head b{font:600 17px Fraunces}.head small{display:block;font-size:11px;color:#7b8f6e}
.wrap{padding:12px 16px}
.l{background:#fffaf3;border-radius:6px 20px 18px 22px/6px 18px 20px 20px;padding:10px 13px;font-size:15.5px;line-height:21px;max-width:85%;margin-bottom:8px;box-shadow:0 1px 0 #e2cdb8}
.sys{text-align:center;margin:12px 0 18px}.sys span{background:#c96f4a;color:#fff6ec;padding:9px 16px;border-radius:22px 16px 24px 14px;font:500 17px/24px Fraunces;display:inline-block;transform:rotate(-1deg)}
.r{margin-left:auto;background:#a9bf9a;color:#22301b}
.in{position:absolute;bottom:20px;left:14px;right:14px;display:flex;gap:8px}
.in div{flex:1;background:#fffaf3;border-radius:24px 20px 22px 26px;padding:13px 16px;color:#a08c7c;font-size:15px}
.send{width:48px;height:48px;border-radius:50% 46% 52% 48%;background:#c96f4a;color:#fff;display:grid;place-items:center;font-size:20px}
.card{background:#fffaf3;border-radius:16px 22px 18px 20px;padding:9px 12px;margin-bottom:8px;border-left:5px solid #c96f4a;font-size:12px;line-height:17px}
.card:nth-of-type(2n){border-left-color:#7b9a6a}
.card h3{font:600 15px Fraunces}.meta{color:#7b6a5d}.why{color:#56704a;font-weight:500;margin-top:2px}
.btn{display:block;margin:4px auto 8px;background:#c96f4a;color:#fff6ec;border:none;border-radius:22px 18px 24px 16px;padding:10px 26px;font:600 14.5px 'DM Sans'}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chip{background:#e3ead9;color:#3f5634;border-radius:16px 12px 17px 13px;padding:5px 11px;font-size:12.5px}
.foot{position:absolute;bottom:8px;right:16px;font-size:10px;color:#b29a85}.pass{background:#fffaf3;border-radius:16px 20px 18px 22px;margin-bottom:8px;position:relative;overflow:hidden;box-shadow:0 1px 0 #e2cdb8}
.pass:before,.pass:after{content:'';position:absolute;top:35px;width:14px;height:14px;border-radius:50%;background:#f3e6d8}
.pass:before{left:-7px}.pass:after{right:-7px}
.ptop{padding:7px 14px 6px;display:flex;justify-content:space-between;align-items:baseline}
.ptop h3{font:600 15px Fraunces}.code{font:600 13px 'DM Sans';letter-spacing:.12em;color:#c96f4a}
.tear{border-top:2px dashed #e2cdb8;margin:0 12px}
.pg{display:grid;grid-template-columns:1fr 1fr 1fr;padding:5px 14px 1px;gap:3px}
.pg span{display:block;font:500 9px 'DM Sans';letter-spacing:.08em;text-transform:uppercase;color:#a08c7c}.pg b{font-size:12px;font-weight:600}
.pwhy{padding:2px 14px 8px;font-family:Caveat;font-size:15px;color:#8a4b32;font-weight:500;line-height:17px}
.chips{justify-content:flex-start}.chips.c{justify-content:center}
.chip.big{font-size:14.5px;padding:9px 15px;background:#fffaf3;color:#3b2a22;border:1.5px solid #c96f4a}
.chip.on{background:#c96f4a;color:#fff6ec;border-color:#c96f4a}
.chip.sage{font-size:14px;padding:8px 13px}
.lbl{font:500 10px 'DM Sans';letter-spacing:.08em;text-transform:uppercase;color:#a08c7c;margin:10px 0 6px}
.dim{position:absolute;inset:0;background:rgba(59,42,34,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fffaf3;border-radius:26px 30px 0 0;padding:12px 22px 28px}
.grab{width:42px;height:5px;border-radius:3px;background:#e2cdb8;margin:0 auto 14px}
.sheet h2{font:600 22px/28px Fraunces;margin-bottom:6px}.sub{font-size:14px;line-height:20px;color:#7b6a5d}
.ob{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1.5px solid #e2cdb8;background:#fff;border-radius:16px 14px 17px 13px;padding:13px;font:600 15px 'DM Sans';color:#3b2a22;margin-top:10px}
.pb{display:block;width:100%;background:#c96f4a;color:#fff6ec;border:none;border-radius:18px 15px 19px 14px;padding:14px;font:600 16px 'DM Sans';text-align:center}
.skip{text-align:center;margin-top:14px;font-size:14px;color:#7b6a5d;text-decoration:underline;text-underline-offset:3px}
.note{font-size:10px;color:#b29a85;text-align:center;margin-top:8px}
.fact{background:#fffaf3;border-radius:16px 20px 18px 22px;padding:10px 14px;margin-bottom:8px;max-width:88%;box-shadow:0 1px 0 #e2cdb8;font-size:14px;line-height:20px}
.fact h3{font:600 15px Fraunces;margin-bottom:4px}.fr{display:flex;justify-content:space-between;padding:4px 0;border-top:1px dashed #e2cdb8}.fr span{color:#7b6a5d}
.hand{font-family:Caveat;font-size:15px;color:#8a4b32;line-height:17px}
.ttl{font:600 26px/32px Fraunces}
.li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:20px;margin:10px 0}
.tick{flex:none;width:22px;height:22px;border-radius:50% 46% 52% 48%;background:#e3ead9;color:#3f5634;display:grid;place-items:center;font-size:13px;font-weight:700}
.plan{flex:1;border:1.5px solid #e2cdb8;border-radius:16px 18px 15px 19px;padding:11px 12px;background:#fffaf3;position:relative}
.plan.sel{border:2px solid #c96f4a}.plan b{font:600 20px Fraunces;display:block}.plan small{font-size:12px;color:#7b6a5d}
.tag{position:absolute;top:-10px;right:10px;background:#7b9a6a;color:#fff;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px}
.typing{display:inline-flex;gap:4px;padding:13px 14px}.typing i{width:7px;height:7px;border-radius:50%;background:#c9b3a0}

html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#f3e6d8;-webkit-text-size-adjust:100%;touch-action:manipulation}
#stage{position:fixed;left:0;right:0;top:0;height:var(--h,100dvh);overflow:hidden}
#app{width:100%;height:100%;position:relative;overflow:hidden;background:#f3e6d8;font-family:'DM Sans';color:#3b2a22;-webkit-tap-highlight-color:transparent;margin:0 auto}
@media (min-width:500px){body{background:#e9dccd}#app{max-width:430px;box-shadow:0 0 0 1px #e2cdb8}}
*{-webkit-tap-highlight-color:transparent}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#f3e6d8}
.scr.fw{animation:sf .28s cubic-bezier(.2,.8,.2,1)}.scr.bk{animation:sb .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sf{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}@keyframes sb{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.bgw{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}.bgw svg{position:absolute;inset:0;width:100%;height:100%}.bgw svg:last-of-type{opacity:0;transition:opacity .3s}
.scr>.head{flex:none;position:relative;z-index:2;padding-top:calc(env(safe-area-inset-top) + 10px)!important;background:rgba(243,230,216,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.scr>.cw{position:relative;top:auto;bottom:auto;flex:1;min-height:0;z-index:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scr>.in,.comp .in{position:relative!important;left:auto;right:auto;bottom:auto;flex:none;z-index:2;margin:0;padding:8px 14px calc(env(safe-area-inset-bottom) + 10px)}
.comp{flex:none;position:relative;z-index:2;padding:8px 14px 0}.comp .in{padding:0 0 calc(env(safe-area-inset-bottom) + 10px)}
.sheet{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)!important;z-index:6}
.chip,.pb,.ob,.btn,.send,[data-a]{-webkit-user-select:none;user-select:none;transition:transform .12s,filter .12s}
.chip:active,.pb:active,.ob:active,.btn:active,.send:active,[data-a]:active{transform:scale(.96);filter:brightness(.95)}
input{font-size:16px!important}
.scr>*{min-width:0;max-width:100%}.stat{position:relative;min-height:100%;padding-bottom:130px}
.scr{position:absolute;inset:0}
[data-a],.chip,.pb,.ob,.skip,.send,.back{cursor:pointer;user-select:none}
.back{font-size:26px;line-height:20px;color:#7b6a5d;padding:6px 6px 6px 0;margin-right:-4px}
.cw{position:absolute;top:62px;bottom:80px;left:0;right:0;overflow-y:auto;padding:12px 16px 16px;scroll-behavior:smooth}
.in input{flex:1;min-width:0;border:none;outline:none;background:#fffaf3;border-radius:24px 20px 22px 26px;padding:12px 16px;font:16px 'DM Sans';color:#3b2a22;-webkit-appearance:none}
.chip.on{background:#c96f4a!important;color:#fff6ec!important;border-color:#c96f4a!important}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:#3b2a22;color:#fff6ec;padding:9px 16px;border-radius:16px 14px 17px 13px;font-size:13.5px;z-index:9;white-space:nowrap}
.fade{animation:fd .25s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.send{display:grid;place-items:center}.send svg{transform:translateX(-1px)}.ob{gap:10px}.status{font-weight:600;letter-spacing:-.01em}.back{display:flex;align-items:center}</style></head><body><div id=stage><div id=app></div></div>

let DIR="fw";function go(s,mut){DIR="fw";H.push({screen,S:clone(S)});if(mut)mut(S);screen=s;history.pushState({n:H.length},"");render()}
function step(mut){go(screen,mut);}
function back(){if(!H.length)return;DIR="bk";const p=H.pop();screen=p.screen;const keep={saved:S.saved,later:S.later};S=p.S;Object.assign(S,keep);S.sheet=false;render()}
window.addEventListener("popstate",()=>back());
const N=()=>S.name||"friend";
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=h=>h.replaceAll("{{N}}",esc(N()));
// ---------- bits
const L=t=>`<div class="l fade">${t}</div>`, R=t=>`<div class="l r fade">${t}</div>`;
const head=(sub="here for you",bk=true)=>`<div class=head>${bk?'<span class=back data-a="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7b6a5d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></span>':''}${D.CAPA40}<div><b>Leapo</b><small>${sub}</small></div>${S.saved?'<span style="margin-left:auto;font-size:12px;color:#3f5634;background:#e3ead9;padding:4px 10px;border-radius:12px 10px 13px 9px">✓ Saved</span>':S.later?'<span data-a="opensave" style="margin-left:auto;font-size:12.5px;font-weight:600;color:#fff6ec;background:#c96f4a;padding:6px 12px;border-radius:14px 11px 15px 12px">Save progress</span>':''}</div>`;
const chip=(t,a,on,cls="chip big")=>`<span class="${cls}${on?" on":""}" data-a="${a}" data-v="${esc(t)}">${t}</span>`;
const chips=(arr,a,sel=[],cls)=>`<div class=chips style="gap:8px;margin:4px 0 10px">${arr.map(t=>chip(t,a,sel.includes(t),cls)).join("")}</div>`;
const inputBar=(ph,a="say")=>`<div class=in><input id=msg placeholder="${ph}" autocomplete=off enterkeyhint=send><span class=send data-a="${a}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff6ec" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3.5 10.2l7 2.6 2.7 7.2L21 3z"/><path d="m10.5 12.8 4.3-4.3"/></svg></span></div>`;
const bgw=k=>`<div class=bgw>${D.BG[k]||""}</div>`;
function chatScr(bgk,inner,ph="Type a message",a="say",sub){return `${bgw(bgk)}${head(sub)}<div class=cw id=cw>${inner}</div>${inputBar(ph,a)}`}

function seqHTML(Q,pre){let h=pre;for(const q of Q){h+=L(q.q);const v=S.a[q.k];
 if(v===undefined||(q.multi&&!S.a[q.k+"_done"])){const sel=v||[];h+=chips(q.o,q.multi?"tog":"ans",sel).replace(/data-a="(tog|ans)"/g,`data-a="$1" data-k="${q.k}"`);
  if(q.multi)h+=`<div style="text-align:right"><span class=btn style="display:inline-block;margin:0;cursor:pointer;opacity:${sel.length?1:.45}" data-a="done" data-k="${q.k}">Done</span></div>`;return h}
 h+=R(Array.isArray(v)?v.join(", "):v)}return null}
